name: Release Windows

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag, for example v0.1.7'
        required: true
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run build:server
      - name: Package
        run: npx electron-builder --win nsis --publish never
      - name: Create release and upload Windows assets
        shell: pwsh
        run: |
          $tag = "${{ inputs.release_tag || github.ref_name }}"
          gh release view "$tag" 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create "$tag" --title "$tag" --generate-notes --latest
          } else {
            gh release edit "$tag" --draft=false --prerelease=false --latest
          }
          $assets = Get-ChildItem -LiteralPath release -File | ForEach-Object { $_.FullName }
          gh release upload "$tag" $assets --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
