name: Build macOS

on:
  workflow_dispatch:

jobs:
  build-mac:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create excluded data directory
        run: mkdir -p data

      - name: Build frontend
        run: npm run build

      - name: Build macOS package
        run: npx electron-builder --mac dmg zip --x64 --arm64
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PhantomTower-macOS
          path: |
            dist/*.dmg
            dist/*-mac.zip