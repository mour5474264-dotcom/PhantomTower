name: Release macOS

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-mac:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create excluded data directory
        run: mkdir -p data

      - name: Build frontend
        run: npm run build

      - name: Build local server bundle
        run: npm run build:server

      - name: Build Intel Mac package
        run: npx electron-builder --mac dmg zip --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Save Intel Mac assets
        shell: bash
        run: |
          rm -rf mac-assets
          mkdir -p mac-assets
          find release -maxdepth 1 -type f -exec cp {} mac-assets/ \;

      - name: Build Apple Silicon package
        run: npx electron-builder --mac dmg zip --arm64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Save Apple Silicon assets
        shell: bash
        run: |
          find release -maxdepth 1 -type f -exec cp {} mac-assets/ \;

      - name: Upload macOS assets to the Windows-created release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          for attempt in {1..30}; do
            if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
              break
            fi
            echo "Waiting for Windows workflow to create ${GITHUB_REF_NAME} (attempt ${attempt}/30)..."
            sleep 10
          done
          while IFS= read -r -d '' asset; do
            gh release upload "${GITHUB_REF_NAME}" "$asset" --clobber
          done < <(find mac-assets -maxdepth 1 -type f -print0)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

