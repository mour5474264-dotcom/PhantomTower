name: Release macOS

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-mac:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create excluded data directory
        run: mkdir -p data

      - name: Build frontend
        run: npm run build

      - name: Build local server bundle
        run: npm run build:server

      - name: Build Intel Mac package
        run: npx electron-builder --mac dmg zip --x64 --publish always
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Apple Silicon package
        run: npx electron-builder --mac dmg zip --arm64 --publish always
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

